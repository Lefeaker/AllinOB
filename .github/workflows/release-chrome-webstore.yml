name: Release Chrome Web Store

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Chrome Web Store package
    runs-on: ubuntu-latest
    environment:
      name: chrome-webstore-release
    env:
      ZENDIO_GA_MEASUREMENT_ID: ${{ vars.ZENDIO_GA_MEASUREMENT_ID }}
      ZENDIO_GA_TRANSPORT_MODE: ${{ vars.ZENDIO_GA_TRANSPORT_MODE }}
      ZENDIO_GA_PROXY_ENDPOINT: ${{ vars.ZENDIO_GA_PROXY_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Require GA public release config
        shell: bash
        run: |
          : "${ZENDIO_GA_MEASUREMENT_ID:?missing GitHub Environment variable ZENDIO_GA_MEASUREMENT_ID}"
          : "${ZENDIO_GA_TRANSPORT_MODE:?missing GitHub Environment variable ZENDIO_GA_TRANSPORT_MODE}"
          : "${ZENDIO_GA_PROXY_ENDPOINT:?missing GitHub Environment variable ZENDIO_GA_PROXY_ENDPOINT}"

      - name: Validate GA public release config
        run: npm run analytics:validate:prod

      - name: Run release quality gates
        run: npm run quality

      - name: Build Chrome GA production bundle
        run: node scripts/build.mjs --mode=prod --skip-checks

      - name: Package Chrome extension
        run: npm run package:ci

      - name: Resolve package path
        id: package
        shell: bash
        run: |
          mapfile -t zip_files < <(find . -maxdepth 1 -type f -name '*.zip' -print)
          if [ "${#zip_files[@]}" -ne 1 ]; then
            printf 'Expected exactly one root zip package, found %s\n' "${#zip_files[@]}" >&2
            printf '%s\n' "${zip_files[@]}" >&2
            exit 1
          fi
          printf 'zip_path=%s\n' "${zip_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Audit Chrome GA release package
        run: |
          npm run audit:ga:client-secret
          npm run audit:ga:release-surface -- --archive "${{ steps.package.outputs.zip_path }}"

      - name: Upload Chrome Web Store package artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-webstore-package
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: node scripts/publish-chrome-webstore.mjs --publish --zip "${{ steps.package.outputs.zip_path }}"
